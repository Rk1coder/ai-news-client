services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local_db.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-haiku-4-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AUTO_SCAN_ENABLED: ${AUTO_SCAN_ENABLED:-true}
      SCAN_TIMEZONE: ${SCAN_TIMEZONE:-Europe/Istanbul}
      SCAN_HOURS: ${SCAN_HOURS:-6,10,14,18,22}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  scheduler:
    build: .
    command: ["python", "-m", "ai_news_radar.scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-haiku-4-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AUTO_SCAN_ENABLED: ${AUTO_SCAN_ENABLED:-true}
      SCAN_TIMEZONE: ${SCAN_TIMEZONE:-Europe/Istanbul}
      SCAN_HOURS: ${SCAN_HOURS:-6,10,14,18,22}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
