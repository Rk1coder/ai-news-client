<svg width="100%" viewBox="0 0 1260 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <title>AI News Radar mimarisi</title>
  <desc>Dış istemciler X-API-Key ile FastAPI servisine bağlanır; FastAPI PostgreSQL'i okur/yazar. Bağımsız bir Scheduler servisi periyodik olarak Ingestion Connectors -&gt; Verification -&gt; Classification (LLM) hattını tetikler ve sonucu PostgreSQL'e yazar; isteğe bağlı olarak Telegram'a bildirim gönderir. Tümü Docker Compose ile tek makinede çalışır.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="860" fill="#ffffff"/>

  <!-- Clients -->
  <g>
    <rect x="440" y="20" width="320" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">Üçüncü taraf istemciler</text>
    <text x="600" y="68" text-anchor="middle" font-size="12" fill="#4338ca">X-API-Key ile herhangi bir uygulama</text>
  </g>

  <line x1="600" y1="90" x2="600" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="150" font-size="12" fill="#4b5563">HTTPS + X-API-Key</text>

  <!-- Docker Compose boundary -->
  <rect x="30" y="150" width="1200" height="640" rx="16" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="50" y="178" font-size="14" font-weight="600" fill="#4b5563">Docker Compose</text>

  <!-- API -->
  <g>
    <rect x="440" y="200" width="320" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="600" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">API (FastAPI) · :8008</text>
    <text x="600" y="248" text-anchor="middle" font-size="12" fill="#059669">/api/*, /health, /docs</text>
  </g>

  <!-- Scheduler -->
  <g>
    <rect x="440" y="310" width="320" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="600" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">Scheduler</text>
    <text x="600" y="354" text-anchor="middle" font-size="12" fill="#b45309">periyodik tarama döngüsü</text>
  </g>

  <!-- Scheduler -> Ingestion bus -->
  <path d="M600 370 L600 390 L220 390 L220 410" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="383" font-size="12" fill="#4b5563">tetikler</text>

  <!-- Ingestion -->
  <g>
    <rect x="70" y="410" width="300" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="220" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">Ingestion connectors</text>
    <text x="220" y="462" text-anchor="middle" font-size="12" fill="#b45309">RSS · Arxiv · HackerNews</text>
    <text x="220" y="480" text-anchor="middle" font-size="12" fill="#b45309">HuggingFace · Substack · bloglar</text>
  </g>

  <line x1="375" y1="475" x2="405" y2="475" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verification -->
  <g>
    <rect x="410" y="410" width="240" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="530" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">Verification</text>
    <text x="530" y="462" text-anchor="middle" font-size="12" fill="#b45309">kaynak güvenilirliği +</text>
    <text x="530" y="480" text-anchor="middle" font-size="12" fill="#b45309">çapraz doğrulama</text>
  </g>

  <line x1="655" y1="475" x2="675" y2="475" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Classification -->
  <g>
    <rect x="680" y="410" width="300" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="830" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">Classification (LLM)</text>
    <text x="830" y="462" text-anchor="middle" font-size="12" fill="#b45309">Anthropic Claude veya Gemini</text>
    <text x="830" y="480" text-anchor="middle" font-size="12" fill="#b45309">skor + TR çeviri + özet</text>
  </g>

  <!-- Classification -> Telegram (optional) -->
  <line x1="985" y1="475" x2="1005" y2="475" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="975" y="400" font-size="12" fill="#6b7280">opsiyonel</text>

  <!-- Telegram -->
  <g>
    <rect x="1010" y="410" width="150" height="130" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="1085" y="470" text-anchor="middle" font-size="15" font-weight="600" fill="#4b5563">Telegram</text>
    <text x="1085" y="490" text-anchor="middle" font-size="12" fill="#6b7280">bildirim</text>
  </g>

  <!-- Classification -> Postgres -->
  <path d="M830 540 L830 600 L600 600 L600 660" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="575" font-size="12" fill="#4b5563">sonuç yazılır</text>

  <!-- API <-> Postgres (routed right, around Telegram) -->
  <path d="M760 235 L1195 235 L1195 700 L770 700" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1000" y="222" font-size="12" fill="#4b5563">okuma / yazma</text>

  <!-- Postgres -->
  <g>
    <rect x="430" y="660" width="340" height="80" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="600" y="693" text-anchor="middle" font-size="15" font-weight="600" fill="#075985">PostgreSQL</text>
    <text x="600" y="714" text-anchor="middle" font-size="12" fill="#0369a1">sources · raw_items · developments</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#4b5563">
    <rect x="40" y="810" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1"/>
    <text x="60" y="821">dış erişim</text>

    <rect x="180" y="810" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981"/>
    <text x="200" y="821">API servisi</text>

    <rect x="320" y="810" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="340" y="821">veri pipeline (scheduler)</text>

    <rect x="560" y="810" width="14" height="14" rx="3" fill="#f0f9ff" stroke="#0ea5e9"/>
    <text x="580" y="821">depolama</text>

    <rect x="700" y="810" width="14" height="14" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="3 3"/>
    <text x="720" y="821">opsiyonel / dış entegrasyon</text>
  </g>
</svg>
